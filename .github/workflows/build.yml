name: Build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Test and package for the deployment libc
        run: |
          docker run --rm -v "$PWD:/src" -w /src golang:1.26-bookworm bash -ceu '
            make test
            go test -race ./...
            make vet
            make package VERSION="${1#v}" GOOS=linux GOARCH=amd64
            readelf --version-info dist/zcode.so
            sort dist/*.sha256 > dist/checksums.txt
          ' bash "$GITHUB_REF_NAME"
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/checksums.txt --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes "ZCode OAuth, Flash grant quota, and host-managed streaming for the homelab. Linux amd64, built on Debian bookworm."
